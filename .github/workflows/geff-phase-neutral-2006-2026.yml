name: GEff Phase-Neutral 2006-2026 Audit

on:
  workflow_dispatch:
  push:
    branches:
      - geff-h70-h120-phase-sweep-20260901
    paths:
      - '.github/workflows/geff-phase-neutral-2006-2026.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Build long-history runner
        run: |
          base64 -d research/geff_phase/run_geff_h70_h120_phase_sweep.py.gz.b64 | gzip -dc > research/geff_phase/run_geff_phase_neutral_long.py
          python - <<'PY'
          from pathlib import Path
          p=Path('research/geff_phase/run_geff_phase_neutral_long.py')
          s=p.read_text()
          s=s.replace("OUT = Path('results_geff_horizon_phase')", "OUT = Path('results_geff_phase_neutral_long')")
          s=s.replace("BASE_SIGNAL = pd.Timestamp('2016-07-29')", "BASE_SIGNAL = pd.Timestamp('2006-01-06')")
          s=s.replace("CONTROL_START = pd.Timestamp('2016-08-02')", "CONTROL_START = pd.Timestamp('2006-01-10')")
          s=s.replace("LOAD_START = pd.Timestamp('2014-01-02')", "LOAD_START = pd.Timestamp('2004-01-02')")
          s=s.replace("HORIZONS = list(range(30, 121, 5))", "HORIZONS = [80,85,90,95,100]")
          s=s.replace("phase_metrics_285.csv", "phase_metrics_90.csv")
          s=s.replace("daily_{name}_285.csv.gz", "daily_{name}_90.csv.gz")
          s=s.replace("All 285 Hxphase cells", "All 90 Hxphase cells")
          needle="    mom_rank,def_rank,elig_n=compute_signal_ranks(close,ret,eps,cal,signal_indices,codes,start_dates,end_dates)\n"
          inject=r'''    mom_rank,def_rank,elig_n=compute_signal_ranks(close,ret,eps,cal,signal_indices,codes,start_dates,end_dates)

    # Cross-sectional factor validity audit. Forward windows overlap, so report Newey-West t-statistics.
    ic_rows=[]
    rng=np.random.default_rng(20260901)
    for w,t in enumerate(signal_indices):
        for style,ranks in [('MOM',mom_rank),('DEF',def_rank)]:
            rk=ranks[w].astype(np.float64)
            base=rk>0
            for fh in [5,20,60,90]:
                if t+fh>=len(cal):
                    continue
                p0=close[t].astype(np.float64,copy=False); p1=close[t+fh].astype(np.float64,copy=False)
                g=base & np.isfinite(p0)&np.isfinite(p1)&(p0>0)&(p1>0)
                ids=np.flatnonzero(g)
                if len(ids)<20:
                    continue
                y=p1[ids]/p0[ids]-1.0
                x=-rk[ids]
                xr=pd.Series(x).rank(method='average').to_numpy(float)
                yr=pd.Series(y).rank(method='average').to_numpy(float)
                ic=float(np.corrcoef(xr,yr)[0,1]) if np.std(xr)>0 and np.std(yr)>0 else np.nan
                order=np.argsort(rk[ids])
                k=min(10,len(ids))
                top=float(np.mean(y[order[:k]])); allm=float(np.mean(y)); spread=top-allm
                rand=[]
                for _ in range(20):
                    jj=rng.choice(len(ids),size=k,replace=False)
                    rand.append(float(np.mean(y[jj])))
                rand_spread=float(np.mean(rand)-allm)
                ic_rows.append({'signal_date':str(cal[t].date()),'style':style,'fwd_sessions':fh,'n':len(ids),'rank_ic':ic,'top10_return':top,'eligible_return':allm,'top10_spread':spread,'random10_spread':rand_spread})
    icdf=pd.DataFrame(ic_rows)
    icdf.to_csv(OUT/'factor_ic_weekly.csv',index=False)
    def nw_t(x,lag):
        x=np.asarray(pd.Series(x).dropna(),float); n=len(x)
        if n<3: return np.nan
        u=x-x.mean(); s=float(np.dot(u,u)/n)
        L=min(int(lag),n-1)
        for k in range(1,L+1):
            gam=float(np.dot(u[k:],u[:-k])/n)
            s += 2.0*(1.0-k/(L+1.0))*gam
        se=math.sqrt(max(s,0.0)/n) if s>=0 else np.nan
        return float(x.mean()/se) if se and se>0 else np.nan
    sm=[]
    for (style,fh),g in icdf.groupby(['style','fwd_sessions']):
        lag=max(1,int(math.ceil(fh/5)))
        sm.append({'style':style,'fwd_sessions':fh,'n_signals':len(g),'ic_mean':float(g.rank_ic.mean()),'ic_median':float(g.rank_ic.median()),'ic_positive_fraction':float((g.rank_ic>0).mean()),'ic_nw_t':nw_t(g.rank_ic,lag),'top10_spread_mean':float(g.top10_spread.mean()),'top10_spread_nw_t':nw_t(g.top10_spread,lag),'random10_spread_mean':float(g.random10_spread.mean()),'random10_spread_nw_t':nw_t(g.random10_spread,lag)})
    pd.DataFrame(sm).to_csv(OUT/'factor_ic_summary.csv',index=False)
'''
          if needle not in s: raise SystemExit('inject needle missing')
          s=s.replace(needle,inject)
          p.write_text(s)
          PY
      - name: Run 2006-2026 stock-level phase-neutral audit
        env:
          QLIB_RELEASE_TAG: '2026-08-30'
        run: python -u research/geff_phase/run_geff_phase_neutral_long.py 2>&1 | tee geff_phase_neutral_long.log
      - name: Build fixed equal-H all-phase ensemble
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, numpy as np, math
          P=Path('results_geff_phase_neutral_long')
          HS=[80,85,90,95,100]
          def met(r,d):
              r=np.asarray(r,float); nav=np.cumprod(1+r); years=max((d.iloc[-1]-d.iloc[0]).days/365.2425,len(r)/252.0)
              cagr=nav[-1]**(1/years)-1 if nav[-1]>0 else -1
              peak=np.maximum.accumulate(nav); mdd=float(np.min(nav/peak-1)); sd=float(np.std(r,ddof=1)); sh=float(np.mean(r)/sd*np.sqrt(252)) if sd>0 else np.nan
              return cagr,mdd,sh,float(nav[-1])
          rows=[]
          out=None
          for layer in ['mom','def','pre_risk','h1_v12','pos1']:
              x=pd.read_csv(P/f'daily_{layer}_90.csv.gz',compression='gzip'); x.trade_date=pd.to_datetime(x.trade_date)
              hd=[]
              for h in HS:
                  cols=[c for c in x.columns if c.startswith(f'H{h}_P')]
                  hd.append(x[cols].mean(axis=1).to_numpy(float))
              r=np.mean(np.vstack(hd),axis=0)
              if out is None: out=pd.DataFrame({'trade_date':x.trade_date})
              out[layer+'_equalH_allphase']=r
              periods=[('2006_2016','2006-01-10','2016-08-01'),('2016_2026','2016-08-02','2026-07-29'),('2006_2026','2006-01-10','2026-07-29')]
              for pname,a,b in periods:
                  g=(x.trade_date>=a)&(x.trade_date<=b); cagr,mdd,sh,nav=met(r[g],x.trade_date[g].reset_index(drop=True))
                  rows.append({'layer':layer,'period':pname,'cagr':cagr,'mdd':mdd,'sharpe':sh,'ending_nav':nav,'rule':'H80/85/90/95/100 equal 20%; all phases equal within H'})
          out.to_csv(P/'phase_neutral_equalH_daily.csv',index=False)
          pd.DataFrame(rows).to_csv(P/'phase_neutral_equalH_summary.csv',index=False)
          print(pd.DataFrame(rows).to_string(index=False))
          print('\nFACTOR IC')
          print(pd.read_csv(P/'factor_ic_summary.csv').to_string(index=False))
          PY
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geff-phase-neutral-2006-2026-results
          path: |
            results_geff_phase_neutral_long/
            geff_phase_neutral_long.log
          retention-days: 14
