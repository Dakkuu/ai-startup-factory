name: A-share Multi Alpha System V1
on:
  push:
    branches: [geff-fundamental-pit-20260902]
    paths:
      - 'a-share-backtest/run_multi_alpha_system_v1.py'
      - 'a-share-backtest/MULTI_ALPHA_PREREG_2026-09-03.md'
      - '.github/workflows/multi-alpha-system-v1.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests akshare pyarrow
      - name: Download PIT fundamental artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p a-share-backtest/artifact_cache/value a-share-backtest/artifact_cache/stmt
          gh run download 33634216408 -n geff-fundamental-period-v2-value -D a-share-backtest/artifact_cache/value
          gh run download 33634216408 -n geff-fundamental-period-v2-3stmt -D a-share-backtest/artifact_cache/stmt
      - name: Run multi-alpha research
        working-directory: a-share-backtest
        run: python -u run_multi_alpha_system_v1.py
      - name: Print key outputs
        if: always()
        working-directory: a-share-backtest
        run: |
          echo '=== SLEEVES ==='
          cat results_multi_alpha_system_v1/selected_sleeves.csv || true
          echo '=== ALLOCATION ==='
          cat results_multi_alpha_system_v1/allocation_grid.csv || true
          echo '=== GATES ==='
          cat results_multi_alpha_system_v1/gates.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-alpha-system-v1-results
          path: a-share-backtest/results_multi_alpha_system_v1/
          retention-days: 30
