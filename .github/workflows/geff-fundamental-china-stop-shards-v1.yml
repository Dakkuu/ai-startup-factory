name: GEff Fundamental China Stop Shards V1
on:
  push:
    branches: [geff-fundamental-pit-20260902]
    paths:
      - '.github/workflows/geff-fundamental-china-stop-shards-v1.yml'
  workflow_dispatch:
jobs:
  stop:
    strategy:
      fail-fast: false
      matrix:
        n: [5, 7, 10, 12, 15]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests akshare pyarrow
      - name: Download PIT fundamental artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p a-share-backtest/artifact_cache/value a-share-backtest/artifact_cache/stmt
          gh run download 33634216408 -n geff-fundamental-period-v2-value -D a-share-backtest/artifact_cache/value
          gh run download 33634216408 -n geff-fundamental-period-v2-3stmt -D a-share-backtest/artifact_cache/stmt
      - name: Apply exact T+1 and trading-session cooldown patch
        working-directory: a-share-backtest
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('run_geff_fundamental_china_risk_v1.py')
          s=p.read_text()
          s=s.replace("if day>pp.entry_date and stop_trigger(pp,float(cl),rule): pending[c]=day", "if stop_trigger(pp,float(cl),rule): pending[c]=day")
          s=s.replace("cooldown[c]=day+pd.Timedelta(days=cd*2)", "cooldown[c]=trade_cal[min(len(trade_cal)-1, int(trade_cal.searchsorted(day))+cd)]")
          p.write_text(s)
          PY
      - name: Run stop shard
        working-directory: a-share-backtest
        env:
          N_SHARD: ${{ matrix.n }}
        run: |
          python -u - <<'PY'
          import os
          import pandas as pd
          import run_geff_fundamental_china_risk_v1 as m
          n=int(os.environ['N_SHARD'])
          out=m.Path(f'results_geff_china_stop_n{n}'); out.mkdir(exist_ok=True)
          q,p,cal,members,ua,market_code,bm=m.build_candidate()
          pcache=m.PriceCache(cal)
          rules=('none','fixed10','fixed12','fixed15','fixed20','trail12','trail18','hybrid12_18','atr3','hybrid12_18_cd20')
          rows=[]
          for rule in rules:
            for h in m.H_STOP:
              for ph in range(max(1,round(h/5))):
                print('SHARD',n,rule,h,ph,flush=True)
                st,eq,tr,tm=m.stop_sim(q,h,ph,n,rule,cal,members,bm,pcache,1.0); rows.append(st)
          d=pd.DataFrame(rows); d.to_csv(out/'stock_stop_all_phase.csv',index=False)
          s=m.summarize_stop(d); s.to_csv(out/'stock_stop_summary.csv',index=False)
          print(s.to_string(index=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: geff-china-stop-n${{ matrix.n }}
          path: a-share-backtest/results_geff_china_stop_n${{ matrix.n }}/
          retention-days: 30
