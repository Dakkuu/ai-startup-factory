name: A-share simple low-amount isolated
on:
  push:
    branches: [simple-alpha-lab]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-alpha-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pandas numpy scipy scikit-learn lightgbm
      - name: Run low-amount backtest
        working-directory: a-share-backtest
        run: python run_10y_lowamount.py
      - name: Show results
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_lowamount/audit.csv results_lowamount/summary.csv results_lowamount/cost.csv results_lowamount/floor_grid.csv results_lowamount/robust.csv results_lowamount/annual.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-share-simple-lowamount-isolated-results
          path: a-share-backtest/results_lowamount/
          if-no-files-found: warn
          retention-days: 7
