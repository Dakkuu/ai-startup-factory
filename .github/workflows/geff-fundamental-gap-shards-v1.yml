name: GEff Fundamental Gap Shards V1
on:
  push:
    branches: [geff-fundamental-pit-20260902]
    paths:
      - 'a-share-backtest/run_geff_fundamental_gap_shard_v1.py'
      - '.github/workflows/geff-fundamental-gap-shards-v1.yml'
  workflow_dispatch:
jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests akshare pyarrow
      - name: Download PIT fundamental artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p a-share-backtest/artifact_cache/value a-share-backtest/artifact_cache/stmt
          gh run download 33634216408 -n geff-fundamental-period-v2-value -D a-share-backtest/artifact_cache/value
          gh run download 33634216408 -n geff-fundamental-period-v2-3stmt -D a-share-backtest/artifact_cache/stmt
      - name: Run gap shard
        working-directory: a-share-backtest
        run: python -u run_geff_fundamental_gap_shard_v1.py ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: geff-fund-gap-shard-${{ matrix.shard }}
          path: a-share-backtest/results_geff_fund_gap_shard_${{ matrix.shard }}/
          retention-days: 30
