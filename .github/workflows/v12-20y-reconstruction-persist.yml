name: Persistent V12 20Y Reconstruction

on:
  push:
    branches: [a-share-backtest]
    paths:
      - 'a-share-backtest/v12_20y_reconstruction_trigger.txt'
      - '.github/workflows/v12-20y-reconstruction-persist.yml'

permissions:
  contents: write

env:
  QLIB_RELEASE_TAG: '2026-07-29'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a-share-backtest
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - name: Run frozen V12 20y reconstruction
        working-directory: a-share-backtest
        run: python run_20y_v12_reconstruction.py
      - name: Persist results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a-share-backtest/results_v12_20y_reconstruction
          git commit -m 'results: persist V12 20y reconstruction' || exit 0
          git push origin HEAD:a-share-backtest
