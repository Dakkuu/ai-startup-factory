name: GEff Fundamental Integrated V3
on:
  push:
    branches: [geff-fundamental-pit-20260902]
    paths:
      - 'a-share-backtest/run_geff_fundamental_integrated_v3.py'
      - '.github/workflows/geff-fundamental-integrated-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests akshare pyarrow
      - name: Download prior PIT fundamental artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p a-share-backtest/artifact_cache/value a-share-backtest/artifact_cache/stmt
          gh run download 33634216408 -n geff-fundamental-period-v2-value -D a-share-backtest/artifact_cache/value
          gh run download 33634216408 -n geff-fundamental-period-v2-3stmt -D a-share-backtest/artifact_cache/stmt
          find a-share-backtest/artifact_cache -maxdepth 4 -type f | head -50
      - name: Run integrated backtest
        working-directory: a-share-backtest
        run: python -u run_geff_fundamental_integrated_v3.py
      - name: Print outputs
        working-directory: a-share-backtest
        run: |
          cat results_geff_fundamental_integrated_v3/summary.csv
          cat results_geff_fundamental_integrated_v3/cost2x_summary.csv
          cat results_geff_fundamental_integrated_v3/metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: geff-fundamental-integrated-v3
          path: a-share-backtest/results_geff_fundamental_integrated_v3/
          retention-days: 30
