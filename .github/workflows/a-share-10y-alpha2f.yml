name: A-share residual-momentum low-IVOL 2F backtest
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a-share-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy scikit-learn lightgbm scipy
      - name: Run frozen 2-factor backtest
        working-directory: a-share-backtest
        run: python run_10y_alpha2f.py
      - name: Show core results
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_alpha2f/audit.csv results_alpha2f/summary.csv results_alpha2f/ic_summary.csv results_alpha2f/quintiles.csv results_alpha2f/double_cost.csv results_alpha2f/robustness.csv results_alpha2f/annual_returns.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-share-10y-alpha2f-results
          path: a-share-backtest/results_alpha2f/
          if-no-files-found: warn
          retention-days: 7
