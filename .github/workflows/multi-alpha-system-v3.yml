name: A-share Multi Alpha System V3 PostDiag
on:
  push:
    branches: [geff-fundamental-pit-20260902]
    paths:
      - 'a-share-backtest/MULTI_ALPHA_V3_POSTDIAG_PREREG_2026-09-03.md'
      - 'a-share-backtest/run_multi_alpha_short_v3.py'
      - 'a-share-backtest/run_multi_alpha_long_v3.py'
      - 'a-share-backtest/run_multi_alpha_combine_v3.py'
      - '.github/workflows/multi-alpha-system-v3.yml'
  workflow_dispatch:

jobs:
  short:
    strategy:
      fail-fast: false
      matrix:
        family: [pullback60, pullback120, pullback_lowiv, quiet_pullback, market_relative_pullback]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: {OMP_NUM_THREADS: '4', OPENBLAS_NUM_THREADS: '4', MKL_NUM_THREADS: '4', NUMEXPR_NUM_THREADS: '4'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests akshare pyarrow
      - name: Run conditioned short family
        working-directory: a-share-backtest
        run: python -u run_multi_alpha_short_v3.py ${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-alpha-v3-short-${{ matrix.family }}
          path: a-share-backtest/results_multi_alpha_short_v3_${{ matrix.family }}/
          retention-days: 30

  long:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: {OMP_NUM_THREADS: '4', OPENBLAS_NUM_THREADS: '4', MKL_NUM_THREADS: '4', NUMEXPR_NUM_THREADS: '4'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests akshare pyarrow
      - name: Download PIT and frozen V2 long grid
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p a-share-backtest/artifact_cache/value a-share-backtest/artifact_cache/stmt a-share-backtest/long_v2_input
          gh run download 33634216408 -n geff-fundamental-period-v2-value -D a-share-backtest/artifact_cache/value
          gh run download 33634216408 -n geff-fundamental-period-v2-3stmt -D a-share-backtest/artifact_cache/stmt
          gh run download 33774337995 -n multi-alpha-long-v2 -D a-share-backtest/long_v2_input
      - name: Run family-diversified long sleeve
        working-directory: a-share-backtest
        run: python -u run_multi_alpha_long_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-alpha-v3-long
          path: a-share-backtest/results_multi_alpha_long_v3/
          retention-days: 30

  combine:
    needs: [short, long]
    if: always() && needs.short.result == 'success' && needs.long.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests akshare pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: multi-alpha-v3-*
          path: a-share-backtest/multi_alpha_v3_inputs
          merge-multiple: true
      - name: Download frozen V2 medium sleeve
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p a-share-backtest/multi_alpha_v3_inputs/medium
          gh run download 33774337995 -n multi-alpha-medium-v2 -D a-share-backtest/multi_alpha_v3_inputs/medium
      - name: Combine V3 portfolio
        working-directory: a-share-backtest
        run: python -u run_multi_alpha_combine_v3.py
      - name: Print V3 outputs
        if: always()
        working-directory: a-share-backtest
        run: |
          cat results_multi_alpha_system_v3/strategy.json || true
          cat results_multi_alpha_system_v3/selected_sleeves.csv || true
          cat results_multi_alpha_system_v3/allocation_grid.csv || true
          cat results_multi_alpha_system_v3/allocation_cost_stress.csv || true
          cat results_multi_alpha_system_v3/gates.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-alpha-system-v3-results
          path: a-share-backtest/results_multi_alpha_system_v3/
          retention-days: 30
