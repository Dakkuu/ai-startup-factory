name: A-share 10y flow-network strict real-price no-event
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a-share-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scikit-learn akshare
      - name: Run real-price strict audit
        working-directory: a-share-backtest
        run: python run_10y_a_share_flow_network_strict_realprice_noevent.py
      - name: Show results
        if: always()
        working-directory: a-share-backtest
        run: |
          if [ -f results_10y_flow_network_strict_realprice_noevent/audit.csv ]; then cat results_10y_flow_network_strict_realprice_noevent/audit.csv; fi
          if [ -f results_10y_flow_network_strict_realprice_noevent/summary.csv ]; then cat results_10y_flow_network_strict_realprice_noevent/summary.csv; fi
          if [ -f results_10y_flow_network_strict_realprice_noevent/robustness.csv ]; then cat results_10y_flow_network_strict_realprice_noevent/robustness.csv; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-share-10y-flow-network-strict-realprice-noevent-results
          path: a-share-backtest/results_10y_flow_network_strict_realprice_noevent/
          retention-days: 7
