name: LowPrice Anti-Lottery V5
on:
  pull_request:
    branches: [alpha-concentration-v4-isolated]
permissions:
  contents: read
concurrency:
  group: lowprice-antilottery-v5
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env: {OMP_NUM_THREADS: 4, OPENBLAS_NUM_THREADS: 4, MKL_NUM_THREADS: 4, NUMEXPR_NUM_THREADS: 4}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Run five-architecture train-only selection and frozen validation
        working-directory: a-share-backtest
        run: python run_10y_lowprice_antilottery_v5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lowprice-antilottery-v5
          path: a-share-backtest/results_lowprice_antilottery_v5/
          if-no-files-found: warn
          retention-days: 14
