name: LP Heavy Frozen Isolated
on:
  pull_request:
    branches: [lp-audit-base-20260823]
permissions:
  contents: read
concurrency:
  group: lp-heavy-frozen-isolated-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        mode: [core, capacity, delay, noise, delete, placebo]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env: {OMP_NUM_THREADS: 4, OPENBLAS_NUM_THREADS: 4, MKL_NUM_THREADS: 4, NUMEXPR_NUM_THREADS: 4}
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.event.pull_request.head.sha }}}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Frozen price-heavy validation
        working-directory: a-share-backtest
        run: python run_10y_lowprice_heavy_frozen_v1.py ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp-heavy-frozen-${{ matrix.mode }}
          path: a-share-backtest/results_lowprice_strict_v2_${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 14
