name: A-share Multi Alpha System V2 Sharded
on:
  push:
    branches: [geff-fundamental-pit-20260902]
    paths:
      - 'a-share-backtest/build_multi_alpha_panel_v2.py'
      - 'a-share-backtest/run_multi_alpha_shard_v2.py'
      - 'a-share-backtest/aggregate_multi_alpha_v2.py'
      - '.github/workflows/multi-alpha-system-v2-sharded.yml'
  workflow_dispatch:

env:
  OMP_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  NUMEXPR_NUM_THREADS: '4'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests akshare pyarrow
      - name: Download frozen PIT fundamental artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p a-share-backtest/artifact_cache/value a-share-backtest/artifact_cache/stmt
          gh run download 33634216408 -n geff-fundamental-period-v2-value -D a-share-backtest/artifact_cache/value
          gh run download 33634216408 -n geff-fundamental-period-v2-3stmt -D a-share-backtest/artifact_cache/stmt
      - name: Build reusable signal panel
        working-directory: a-share-backtest
        run: python -u build_multi_alpha_panel_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: multi-alpha-panel-v2
          path: a-share-backtest/results_multi_alpha_panel_v2/
          compression-level: 0
          retention-days: 14

  short:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family: [rev5, mom20, breakout, accel]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests pyarrow
      - uses: actions/download-artifact@v4
        with:
          name: multi-alpha-panel-v2
          path: a-share-backtest/panel_artifact
      - name: Run short-alpha family
        working-directory: a-share-backtest
        run: python -u run_multi_alpha_shard_v2.py short ${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-alpha-short-${{ matrix.family }}-v2
          path: a-share-backtest/results_multi_alpha_shard_v2_short_${{ matrix.family }}/
          retention-days: 14

  long:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        family: [value, quality, value_quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests pyarrow
      - uses: actions/download-artifact@v4
        with:
          name: multi-alpha-panel-v2
          path: a-share-backtest/panel_artifact
      - name: Run long-alpha family
        working-directory: a-share-backtest
        run: python -u run_multi_alpha_shard_v2.py long ${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-alpha-long-${{ matrix.family }}-v2
          path: a-share-backtest/results_multi_alpha_shard_v2_long_${{ matrix.family }}/
          retention-days: 14

  medium:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests pyarrow
      - uses: actions/download-artifact@v4
        with:
          name: multi-alpha-panel-v2
          path: a-share-backtest/panel_artifact
      - name: Run frozen medium sleeve
        working-directory: a-share-backtest
        run: python -u run_multi_alpha_shard_v2.py medium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-alpha-medium-v2
          path: a-share-backtest/results_multi_alpha_shard_v2_medium/
          retention-days: 14

  aggregate:
    needs: [build, short, long, medium]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: multi-alpha-short-*-v2
          path: a-share-backtest/shard_artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: multi-alpha-long-*-v2
          path: a-share-backtest/shard_artifacts
      - uses: actions/download-artifact@v4
        with:
          name: multi-alpha-medium-v2
          path: a-share-backtest/shard_artifacts/multi-alpha-medium-v2
      - uses: actions/download-artifact@v4
        with:
          name: multi-alpha-panel-v2
          path: a-share-backtest/shard_artifacts/multi-alpha-panel-v2
      - name: Aggregate train-only selected system
        working-directory: a-share-backtest
        run: python -u aggregate_multi_alpha_v2.py
      - name: Print final results
        if: always()
        working-directory: a-share-backtest
        run: |
          cat results_multi_alpha_system_v2/selected_sleeves.csv || true
          cat results_multi_alpha_system_v2/correlation_full.csv || true
          cat results_multi_alpha_system_v2/allocation_grid.csv || true
          cat results_multi_alpha_system_v2/allocation_cost_stress.csv || true
          cat results_multi_alpha_system_v2/gates.csv || true
          cat results_multi_alpha_system_v2/metadata.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-alpha-system-v2-results
          path: a-share-backtest/results_multi_alpha_system_v2/
          retention-days: 30
