name: Structural Ensemble V4 PR
on:
  pull_request:
    branches: [alpha-structural-base]
permissions:
  contents: read
concurrency:
  group: structural-ensemble-v4-pr
  cancel-in-progress: true
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env: {OMP_NUM_THREADS: 4, OPENBLAS_NUM_THREADS: 4, MKL_NUM_THREADS: 4, NUMEXPR_NUM_THREADS: 4}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Train-only structural architecture search then frozen validation
        working-directory: a-share-backtest
        run: python run_10y_structural_ensemble_v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-ensemble-v4-pr
          path: a-share-backtest/results_structural_ensemble_v4/
          if-no-files-found: warn
          retention-days: 14
