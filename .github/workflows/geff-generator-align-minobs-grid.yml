name: GEff Generator Alignment Minobs Grid

on:
  push:
    branches:
      - geff-generator-align-20260902
    paths:
      - '.github/workflows/geff-generator-align-minobs-grid.yml'
  workflow_dispatch:

jobs:
  minobs-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Build and run variant grid
        env:
          QLIB_RELEASE_TAG: '2026-08-30'
        run: |
          set -o pipefail
          mkdir -p results_align_minobs
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          src=gzip.decompress(base64.b64decode(Path('research/geff_phase/run_geff_h70_h120_phase_sweep.py.gz.b64').read_bytes())).decode()
          profiles=[
            ('ols252_rm105_res60',252,105,60),
            ('ols220_rm100_res55',220,100,55),
            ('ols200_rm95_res50',200,95,50),
            ('ols180_rm90_res50',180,90,50),
            ('ols126_rm80_res50',126,80,50),
            ('ols126_rm70_res40',126,70,40),
          ]
          for name,om,rm,rv in profiles:
              s=src
              s=s.replace("HORIZONS = list(range(30, 121, 5))", "HORIZONS = [75, 90, 105]")
              s=s.replace("HORIZONS = list(range(70, 121, 5))", "HORIZONS = [75, 90, 105]")
              marker="MAX_RAMP = 0.25"
              s=s.replace(marker, marker+f"\nOLS_MINOBS = {om}\nRMOM_MINOBS = {rm}\nRES_MINOBS = {rv}")
              s=s.replace("g = np.isfinite(y) & (cnt >= window)", "g = np.isfinite(y) & (cnt >= OLS_MINOBS)")
              s=s.replace("rmom[cnt>=RMOM_N] = s[cnt>=RMOM_N]", "rmom[cnt>=RMOM_MINOBS] = s[cnt>=RMOM_MINOBS]")
              s=s.replace("full = cnt >= RES_W", "full = cnt >= RES_MINOBS")
              s=s.replace("base = gate & np.isfinite(rmom)&np.isfinite(ivol)&np.isfinite(down)&np.isfinite(trend)", "factor_complete = member & np.isfinite(rmom)&np.isfinite(ivol)&np.isfinite(down)&np.isfinite(trend)\n        base = gate & factor_complete")
              s=s.replace("'eff_gate_n':int(gate.sum()),'eligible_n':nbase", "'eff_gate_n':int(gate.sum()),'factor_complete_n':int(factor_complete.sum()),'eligible_n':nbase")
              Path(f'research/geff_phase/{name}.py').write_text(s)
          PY
          for profile in ols252_rm105_res60 ols220_rm100_res55 ols200_rm95_res50 ols180_rm90_res50 ols126_rm80_res50 ols126_rm70_res40; do
            echo "===== RUN ${profile} ====="
            rm -rf results_geff_h70_h120_phase
            python -u "research/geff_phase/${profile}.py" 2>&1 | tee "results_align_minobs/${profile}.log"
            mv results_geff_h70_h120_phase "results_align_minobs/${profile}"
            echo "--- ${profile} phase0 ---"
            cat "results_align_minobs/${profile}/phase0_vs_exact_headline.csv"
            echo "--- ${profile} audit head ---"
            head -5 "results_align_minobs/${profile}/ranking_audit.csv"
          done
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          rows=[]
          root=Path('results_align_minobs')
          for d in root.iterdir():
              if not d.is_dir(): continue
              p=d/'phase0_vs_exact_headline.csv'
              a=d/'ranking_audit.csv'
              if not p.exists(): continue
              x=pd.read_csv(p); au=pd.read_csv(a)
              row={'profile':d.name,
                   'mean_abs_cagr_error_pp':x.cagr_error_pp.abs().mean(),
                   'h90_cagr':float(x.loc[x.H.eq(90),'pos1_cagr'].iloc[0]),
                   'h90_error_pp':float(x.loc[x.H.eq(90),'cagr_error_pp'].iloc[0]),
                   'first_eff_valid':int(au.iloc[0].eff_valid),
                   'first_eff_gate':int(au.iloc[0].eff_gate_n),
                   'first_factor_complete':int(au.iloc[0].factor_complete_n),
                   'first_eligible':int(au.iloc[0].eligible_n),
                   'median_factor_complete':float(au.factor_complete_n.median()),
                   'median_eligible':float(au.eligible_n.median())}
              rows.append(row)
          z=pd.DataFrame(rows).sort_values('mean_abs_cagr_error_pp')
          z.to_csv(root/'GRID_SUMMARY.csv',index=False)
          print('GRID_SUMMARY')
          print(z.to_string(index=False))
          PY
      - name: Upload grid
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geff-generator-align-minobs-grid-results
          path: results_align_minobs/
          retention-days: 14
