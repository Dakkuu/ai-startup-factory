name: A-share simple single-factor search
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a-share-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn lightgbm
      - name: Run frozen simple single-factor search
        working-directory: a-share-backtest
        run: python run_10y_simple3.py
      - name: Show results
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_simple3/audit.csv results_simple3/summary.csv results_simple3/ic_summary.csv results_simple3/cost_stress.csv results_simple3/robustness.csv results_simple3/annual.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-share-simple-single-factor-search-results
          path: a-share-backtest/results_simple3/
          if-no-files-found: warn
          retention-days: 7
