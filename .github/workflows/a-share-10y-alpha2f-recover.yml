name: A-share alpha2f recover
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a-share-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn lightgbm
      - name: Download first-run factor panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p a-share-backtest/failed_artifact
          gh run download 32500203073 -R Dakkuu/ai-startup-factory -n a-share-10y-alpha2f-results -D a-share-backtest/failed_artifact
      - name: Recover backtest from frozen panel
        working-directory: a-share-backtest
        run: python recover_alpha2f.py
      - name: Show results
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_alpha2f_recovered/summary.csv results_alpha2f_recovered/ic_summary.csv results_alpha2f_recovered/quintiles.csv results_alpha2f_recovered/double_cost.csv results_alpha2f_recovered/robustness.csv results_alpha2f_recovered/annual_returns.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-share-alpha2f-recovered-results
          path: a-share-backtest/results_alpha2f_recovered/
          if-no-files-found: warn
          retention-days: 7
