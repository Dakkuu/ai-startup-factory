name: A-share historical backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-share-backtest.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: a-share-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
      - name: Run frozen point-in-time Qlib backtest
        working-directory: a-share-backtest
        env:
          QLIB_RELEASE_TAG: '2026-07-29'
          BT_START: '2025-07-30'
          BT_END: '2026-07-29'
        run: python run_backtest_qlib.py
      - name: Show audit and leaderboard
        if: always()
        working-directory: a-share-backtest
        run: |
          if [ -f results_qlib/universe_audit.csv ]; then cat results_qlib/universe_audit.csv; fi
          if [ -f results_qlib/summary.csv ]; then cat results_qlib/summary.csv; fi
          if [ -f results_qlib/segments.csv ]; then cat results_qlib/segments.csv; fi
      - name: Upload audited results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-backtest-qlib-results
          path: |
            a-share-backtest/results_qlib/
          if-no-files-found: warn
          retention-days: 7
