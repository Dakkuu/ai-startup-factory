name: GEff Fundamental Buy Fallback V1
on:
  push:
    branches: [geff-fundamental-pit-20260902]
    paths:
      - 'a-share-backtest/run_geff_fundamental_buy_fallback_v1.py'
      - '.github/workflows/geff-fundamental-buy-fallback-v1.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests akshare pyarrow
      - name: Download PIT fundamental artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p a-share-backtest/artifact_cache/value a-share-backtest/artifact_cache/stmt
          gh run download 33634216408 -n geff-fundamental-period-v2-value -D a-share-backtest/artifact_cache/value
          gh run download 33634216408 -n geff-fundamental-period-v2-3stmt -D a-share-backtest/artifact_cache/stmt
      - name: Run fallback audit
        working-directory: a-share-backtest
        run: python -u run_geff_fundamental_buy_fallback_v1.py
      - name: Print result
        if: always()
        working-directory: a-share-backtest
        run: cat results_geff_fundamental_buy_fallback_v1/summary.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geff-fundamental-buy-fallback-v1
          path: a-share-backtest/results_geff_fundamental_buy_fallback_v1/
          retention-days: 30
