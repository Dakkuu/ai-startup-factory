name: Simple Alpha Fast Lab
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-alpha-fast
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm
      - name: Run local robustness for IVOL-efficiency tilt
        working-directory: a-share-backtest
        run: python run_10y_factor_tilt_robust.py
      - name: Show results
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_factor_tilt_robust/audit.csv results_factor_tilt_robust/grid.csv results_factor_tilt_robust/stability.csv results_factor_tilt_robust/anchor_cost.csv results_factor_tilt_robust/anchor_robust.csv results_factor_tilt_robust/anchor_annual.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simple-alpha-factor-tilt-robust-results
          path: a-share-backtest/results_factor_tilt_robust/
          if-no-files-found: warn
          retention-days: 7
