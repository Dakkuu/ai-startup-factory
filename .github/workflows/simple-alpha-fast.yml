name: Hansen SPA Strict Audit
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
jobs:
  spa-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-spa-strict
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels arch
      - name: Run Hansen SPA and StepM audit
        working-directory: a-share-backtest
        run: python run_10y_spa_audit.py
      - name: Show verdict
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_spa_audit/verdict.csv results_spa_audit/gates.csv results_spa_audit/spa_results.csv results_spa_audit/stepm_results.csv results_spa_audit/dsr_sensitivity.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hansen-spa-strict-audit
          path: a-share-backtest/results_spa_audit/
          if-no-files-found: warn
          retention-days: 14
