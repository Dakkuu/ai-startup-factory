name: Alpha 500 Research Lab
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-500-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Probe DoltHub PIT tables
        working-directory: a-share-backtest
        run: python probe_dolthub_tables.py
      - name: Show probe
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_alpha500_probe/tables.csv results_alpha500_probe/schema_hits.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha500-dolthub-probe
          path: a-share-backtest/results_alpha500_probe/
          if-no-files-found: warn
          retention-days: 7
