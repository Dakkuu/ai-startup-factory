name: Alpha 500 Research Lab
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
concurrency:
  group: alpha500-research
  cancel-in-progress: true
jobs:
  corrected-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-500-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Rerun frozen strategy with corrected volume units
        working-directory: a-share-backtest
        run: python run_10y_volume_fix_baseline.py
      - name: Show corrected baseline
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_volume_unit_fix/verdict.csv results_volume_unit_fix/unit_conversion.csv results_volume_unit_fix/old_vs_corrected.csv results_volume_unit_fix/corrected_costs.csv results_volume_unit_fix/corrected_capacity.csv results_volume_unit_fix/corrected_tail.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-volume-baseline
          path: a-share-backtest/results_volume_unit_fix/
          if-no-files-found: warn
          retention-days: 14
  alpha500:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-500-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Run PIT size-value high-return search with corrected volume units
        working-directory: a-share-backtest
        run: python run_10y_alpha500_size_value_fixed.py
      - name: Show alpha500 verdict
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_alpha500_size_value/verdict.csv results_alpha500_size_value/source_selected.csv results_alpha500_size_value/source_candidates.csv results_alpha500_size_value/pit_coverage.csv results_alpha500_size_value/target_hits.csv results_alpha500_size_value/fullsample_best_exploratory.csv results_alpha500_size_value/train_selected_best.csv results_alpha500_size_value/exact_candidates.csv results_alpha500_size_value/aggressive_exact.csv results_alpha500_size_value/winner_costs.csv results_alpha500_size_value/winner_neighborhood.csv results_alpha500_size_value/winner_capacity.csv results_alpha500_size_value/winner_tail.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha500-size-value-results
          path: a-share-backtest/results_alpha500_size_value/
          if-no-files-found: warn
          retention-days: 14
  alpha-discovery-qv:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-500-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Run signal-pure Qlib price-volume Alpha Discovery A
        working-directory: a-share-backtest
        run: python run_10y_alpha_discovery_qv.py
      - name: Show discovery evidence
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_alpha_discovery_qv/factor_manifest.csv results_alpha_discovery_qv/factor_screen.csv results_alpha_discovery_qv/factor_annual_ic.csv results_alpha_discovery_qv/factor_deciles.csv results_alpha_discovery_qv/exact_finalists.csv results_alpha_discovery_qv/winner_costs.csv results_alpha_discovery_qv/winner_annual.csv results_alpha_discovery_qv/winner_robust.csv results_alpha_discovery_qv/audit.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-discovery-qv-results
          path: a-share-backtest/results_alpha_discovery_qv/
          if-no-files-found: warn
          retention-days: 14
  alpha-composites-qv:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-500-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Run pre-registered composite Alpha families
        working-directory: a-share-backtest
        run: python run_10y_alpha_composites_qv.py
      - name: Show composite evidence
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_alpha_composites_qv/composite_manifest.csv results_alpha_composites_qv/composite_screen.csv results_alpha_composites_qv/construction_grid.csv results_alpha_composites_qv/winner.csv results_alpha_composites_qv/winner_costs.csv results_alpha_composites_qv/winner_annual.csv results_alpha_composites_qv/winner_robust.csv results_alpha_composites_qv/audit.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-composites-qv-results
          path: a-share-backtest/results_alpha_composites_qv/
          if-no-files-found: warn
          retention-days: 14
  alpha-adaptive-qv:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-500-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Run causal trailing-IC adaptive factor rotation
        working-directory: a-share-backtest
        run: python run_10y_alpha_adaptive_qv.py
      - name: Show adaptive evidence
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_alpha_adaptive_qv/adaptive_grid.csv results_alpha_adaptive_qv/winner.csv results_alpha_adaptive_qv/winner_costs.csv results_alpha_adaptive_qv/winner_annual.csv results_alpha_adaptive_qv/winner_robust.csv results_alpha_adaptive_qv/audit.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-adaptive-qv-results
          path: a-share-backtest/results_alpha_adaptive_qv/
          if-no-files-found: warn
          retention-days: 14
  alpha-ml-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-500-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Run strict rolling walk-forward Ridge and LightGBM
        working-directory: a-share-backtest
        run: python run_10y_alpha_ml_walkforward.py
      - name: Show ML evidence
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_alpha_ml_walkforward/feature_manifest.csv results_alpha_ml_walkforward/model_grid.csv results_alpha_ml_walkforward/winner.csv results_alpha_ml_walkforward/winner_costs.csv results_alpha_ml_walkforward/winner_annual.csv results_alpha_ml_walkforward/winner_robust.csv results_alpha_ml_walkforward/audit.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-ml-walkforward-results
          path: a-share-backtest/results_alpha_ml_walkforward/
          if-no-files-found: warn
          retention-days: 14
