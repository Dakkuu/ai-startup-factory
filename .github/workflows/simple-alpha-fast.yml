name: Simple Alpha Fast Lab
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-alpha-fast
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm
      - name: Run skew filter robustness surface
        working-directory: a-share-backtest
        run: python run_10y_skewfilter_surface.py
      - name: Show results
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_skewfilter_surface/audit.csv results_skewfilter_surface/grid.csv results_skewfilter_surface/surface.csv results_skewfilter_surface/anchor_summary.csv results_skewfilter_surface/anchor_annual.csv results_skewfilter_surface/anchor_cost.csv results_skewfilter_surface/anchor_robust.csv results_skewfilter_surface/construction.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simple-alpha-skewfilter-surface-results
          path: a-share-backtest/results_skewfilter_surface/
          if-no-files-found: warn
          retention-days: 7