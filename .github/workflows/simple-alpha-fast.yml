name: Simple Alpha Fast Lab
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-alpha-fast
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm
      - name: Run pre-registered low-price factor
        working-directory: a-share-backtest
        run: python run_10y_lowprice.py
      - name: Show results
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_lowprice/audit.csv results_lowprice/summary.csv results_lowprice/cost.csv results_lowprice/floor_robustness.csv results_lowprice/robust.csv results_lowprice/annual.csv; do if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simple-alpha-fast-results
          path: a-share-backtest/results_lowprice/
          if-no-files-found: warn
          retention-days: 7
