name: Maximum Strict A-share Audit
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
jobs:
  internal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-alpha-fast
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels
      - name: Run maximum strict internal audit
        working-directory: a-share-backtest
        run: python run_10y_max_audit_fixed.py
      - name: Show internal verdict
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_max_audit/manifest_and_verdict.csv results_max_audit/gates.csv results_max_audit/phase_offsets.csv results_max_audit/hold_grid.csv results_max_audit/execution_delay.csv results_max_audit/bootstrap_ci.csv results_max_audit/deflated_sharpe.csv results_max_audit/pbo.csv results_max_audit/reality_check.csv results_max_audit/capacity.csv results_max_audit/date_windows.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maximum-strict-internal-audit
          path: a-share-backtest/results_max_audit/
          if-no-files-found: warn
          retention-days: 14
  external-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-alpha-fast
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels baostock beautifulsoup4 lxml requests
      - name: Run hardened external PIT ST, price and factor audit
        working-directory: a-share-backtest
        run: python run_10y_external_audit_v2.py
      - name: Show external verdict
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_external_audit_v2/external_verdict.csv results_external_audit_v2/external_gates.csv results_external_audit_v2/pit_st_summary.csv results_external_audit_v2/pit_st_annual.csv results_external_audit_v2/cross_source_summary.csv results_external_audit_v2/external_factor_regression.csv results_external_audit_v2/baostock_universe_coverage.csv results_external_audit_v2/final_buys_pit_status.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maximum-strict-external-audit-v2
          path: a-share-backtest/results_external_audit_v2/
          if-no-files-found: warn
          retention-days: 14
