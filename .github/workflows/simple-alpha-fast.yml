name: Mega 5x A-share Search
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
jobs:
  mega-price:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mega-opt-5x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels
      - name: Run large price-risk factor search
        working-directory: a-share-backtest
        run: python run_10y_mega_price_search_stream.py
      - name: Show verdict
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_mega_price/audit.csv results_mega_price/exact_train_candidates.csv results_mega_price/winner_annual.csv results_mega_price/winner_costs.csv results_mega_price/winner_tail.csv results_mega_price/exploratory_fullsample_top20_fast.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mega-price-search
          path: a-share-backtest/results_mega_price/
          if-no-files-found: warn
          retention-days: 14
