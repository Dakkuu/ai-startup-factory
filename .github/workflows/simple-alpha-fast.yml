name: Simple Alpha Fast Lab
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-alpha-fast
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn lightgbm
      - name: Run Low-IVOL trend-gated experiment
        working-directory: a-share-backtest
        run: python run_10y_ivol_trendfilter.py
      - name: Show results
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_ivol_trendfilter/audit.csv results_ivol_trendfilter/grid.csv results_ivol_trendfilter/stability.csv results_ivol_trendfilter/winner_cost.csv results_ivol_trendfilter/winner_robust.csv results_ivol_trendfilter/winner_annual.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simple-alpha-ivol-trendfilter-results
          path: a-share-backtest/results_ivol_trendfilter/
          if-no-files-found: warn
          retention-days: 7
