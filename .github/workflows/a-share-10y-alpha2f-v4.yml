name: A-share simple Low-IVOL final backtest
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a-share-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn lightgbm
      - name: Run corrected Low-IVOL final backtest
        working-directory: a-share-backtest
        run: python run_10y_alpha2f_v4.py
      - name: Show core results
        if: always()
        working-directory: a-share-backtest
        run: |
          for f in results_alpha2f_v4/market_coverage.csv results_alpha2f_v4/audit.csv results_alpha2f_v4/summary.csv results_alpha2f_v4/ic_summary.csv results_alpha2f_v4/quintiles.csv results_alpha2f_v4/cost_stress.csv results_alpha2f_v4/ivol_window_grid.csv results_alpha2f_v4/construction_grid.csv results_alpha2f_v4/robustness.csv results_alpha2f_v4/annual_returns.csv; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-share-simple-lowivol-final-results
          path: a-share-backtest/results_alpha2f_v4/
          if-no-files-found: warn
          retention-days: 7
