name: A-share Qlib archive export

on:
  push:
    branches: [main]
    paths: ['.github/workflows/a-share-qlib-export.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download canonical Qlib archive
        run: |
          curl -L --fail --retry 3 -o qlib_bin.tar.gz https://github.com/chenditc/investment_data/releases/download/2026-07-29/qlib_bin.tar.gz
          sha256sum qlib_bin.tar.gz > SHA256SUM.txt
          ls -lh qlib_bin.tar.gz
      - name: Upload canonical archive
        uses: actions/upload-artifact@v4
        with:
          name: a-share-qlib-bin-2026-07-29
          path: |
            qlib_bin.tar.gz
            SHA256SUM.txt
          compression-level: 0
          retention-days: 1
