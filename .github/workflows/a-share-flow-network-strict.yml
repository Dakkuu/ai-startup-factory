name: A-share 10y flow-network strict backtest
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a-share-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy scikit-learn akshare
      - name: Run strict A-share flow-network backtest
        working-directory: a-share-backtest
        run: python run_10y_a_share_flow_network_strict.py
      - name: Show audit and leaderboard
        if: always()
        working-directory: a-share-backtest
        run: |
          if [ -f results_10y_flow_network_strict/audit.csv ]; then echo '=== AUDIT ==='; cat results_10y_flow_network_strict/audit.csv; fi
          if [ -f results_10y_flow_network_strict/summary.csv ]; then echo '=== SUMMARY ==='; cat results_10y_flow_network_strict/summary.csv; fi
          if [ -f results_10y_flow_network_strict/robustness.csv ]; then echo '=== ROBUSTNESS ==='; cat results_10y_flow_network_strict/robustness.csv; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-share-10y-flow-network-strict-results
          path: a-share-backtest/results_10y_flow_network_strict/
          retention-days: 7
