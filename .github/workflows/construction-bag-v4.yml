name: Construction Bag V4
on:
  pull_request:
    branches: [alpha-concentration-v4-isolated]
permissions:
  contents: read
concurrency:
  group: construction-bag-v4
  cancel-in-progress: true
jobs:
  bag:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env: {OMP_NUM_THREADS: 4, OPENBLAS_NUM_THREADS: 4, MKL_NUM_THREADS: 4, NUMEXPR_NUM_THREADS: 4}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Run construction-platform bagging audit
        working-directory: a-share-backtest
        run: python run_10y_lowprice_construction_bag_v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: construction-bag-v4
          path: a-share-backtest/results_lowprice_construction_bag_v4/
          if-no-files-found: warn
          retention-days: 14
