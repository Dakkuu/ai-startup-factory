name: GEff Fundamental FastPIT V1

on:
  push:
    branches: [geff-fundamental-pit-20260902]
    paths:
      - 'a-share-backtest/run_geff_fundamental_fastpit_v1.py'
      - '.github/workflows/geff-fundamental-fastpit-v1.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      NUMEXPR_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests akshare pyarrow
      - name: Run PIT fundamental screen
        working-directory: a-share-backtest
        run: |
          set -o pipefail
          python -u run_geff_fundamental_fastpit_v1.py 2>&1 | tee geff_fundamental_fastpit_v1.log
      - name: Print results
        if: always()
        working-directory: a-share-backtest
        run: |
          echo '=== IC ==='
          cat results_geff_fundamental_fastpit_v1/fundamental_ic.csv || true
          echo '=== PORTFOLIO ==='
          cat results_geff_fundamental_fastpit_v1/portfolio_summary.csv || true
          echo '=== META ==='
          cat results_geff_fundamental_fastpit_v1/metadata.json || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geff-fundamental-fastpit-v1-results
          path: |
            a-share-backtest/results_geff_fundamental_fastpit_v1/
            a-share-backtest/geff_fundamental_fastpit_v1.log
          retention-days: 14
