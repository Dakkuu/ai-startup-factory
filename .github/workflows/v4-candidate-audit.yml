name: V4 Candidate Frozen Audits
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
concurrency:
  group: v4-candidate-audit-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        candidate: [linear_robust, linear_growth, nonlinear_robust]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env: {OMP_NUM_THREADS: 4, OPENBLAS_NUM_THREADS: 4, MKL_NUM_THREADS: 4, NUMEXPR_NUM_THREADS: 4}
    steps:
      - uses: actions/checkout@v4
        with: {ref: alpha-500-research}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Frozen candidate audit
        working-directory: a-share-backtest
        run: python run_10y_v4_candidate_audit.py ${{ matrix.candidate }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-audit-${{ matrix.candidate }}
          path: a-share-backtest/results_v4_candidate_audit_${{ matrix.candidate }}/
          if-no-files-found: warn
          retention-days: 14
