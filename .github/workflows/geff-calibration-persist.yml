name: Persistent GEff Calibration

on:
  push:
    branches: [a-share-backtest]
    paths:
      - 'a-share-backtest/geff_calibration_trigger.txt'
      - '.github/workflows/geff-calibration-persist.yml'

permissions:
  contents: write

env:
  QLIB_RELEASE_TAG: '2026-07-29'

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a-share-backtest
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - name: Run calibration
        working-directory: a-share-backtest
        run: python calibrate_geff_reconstruction.py
      - name: Persist results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a-share-backtest/results_geff_calibration
          git commit -m 'results: persist GEff calibration' || exit 0
          git push origin HEAD:a-share-backtest
