name: GEff Repaired Frozen Validation
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
concurrency:
  group: geff-repaired-validation-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        mode: [core, capacity, delay, noise, delete, placebo]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env: {OMP_NUM_THREADS: 4, OPENBLAS_NUM_THREADS: 4, MKL_NUM_THREADS: 4, NUMEXPR_NUM_THREADS: 4}
    steps:
      - uses: actions/checkout@v4
        with: {ref: alpha-500-research}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Frozen repaired validation
        working-directory: a-share-backtest
        run: python run_10y_geff_repaired_validation.py ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geff-repaired-${{ matrix.mode }}
          path: a-share-backtest/results_geff_repaired_validation_${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 14
