name: LowPrice Phase Robust V2
on:
  pull_request:
    branches: [simple-alpha-base]
permissions:
  contents: read
concurrency:
  group: lowprice-phase-robust-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env: {OMP_NUM_THREADS: 4, OPENBLAS_NUM_THREADS: 4, MKL_NUM_THREADS: 4, NUMEXPR_NUM_THREADS: 4}
    steps:
      - uses: actions/checkout@v4
        with: {ref: alpha-500-research}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scipy scikit-learn lightgbm statsmodels requests
      - name: Train-only robust search
        working-directory: a-share-backtest
        run: python run_10y_lowprice_phase_robust_v2.py ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lowprice-phase-robust-v2-${{ matrix.shard }}
          path: a-share-backtest/results_lowprice_phase_robust_v2_${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14
